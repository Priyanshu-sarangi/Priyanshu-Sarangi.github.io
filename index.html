<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
  <title>Priyanshu Sarangi | Cybersecurity & Ethical Hacking Portfolio</title>
  <style>
    :root { --bg: #0a0e17; --card: #111827; --border: #1f2937; --accent: #38bdf8; --green: #10b981; --text: #f3f4f6; --muted: #9ca3af; }
    * { box-sizing: border-box; scroll-behavior: smooth; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; line-height: 1.6; }
    nav { background: rgba(17, 24, 39, 0.95); border-bottom: 1px solid var(--border); padding: 15px 20px; position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; max-width: 1100px; margin: auto; }
    .logo { font-weight: 700; font-size: 1.2rem; color: var(--accent); }
    .nav-links a { color: var(--muted); text-decoration: none; margin-left: 20px; font-size: 0.95rem; }
    .nav-links a:hover { color: var(--accent); }
    .container { max-width: 1050px; margin: auto; padding: 40px 20px; }
    .hero { text-align: center; padding: 50px 20px; background: radial-gradient(circle at top, #1e293b 0%, var(--bg) 70%); border-radius: 16px; border: 1px solid var(--border); margin-bottom: 50px; }
    .status-pill { display: inline-block; background: rgba(16, 185, 129, 0.15); color: var(--green); border: 1px solid rgba(16, 185, 129, 0.4); padding: 5px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; margin-bottom: 15px; }
    .hero h1 { font-size: 2.6rem; margin: 10px 0; color: #ffffff; }
    .hero p { max-width: 650px; margin: 15px auto 25px; color: var(--muted); font-size: 1.05rem; }
    .cta-group { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
    .btn { padding: 10px 22px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 0.95rem; }
    .btn-primary { background: var(--accent); color: #0a0e17; }
    .btn-outline { border: 1px solid var(--border); color: var(--text); background: var(--card); }
    .section-title { font-size: 1.5rem; margin: 45px 0 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    .section-title span { color: var(--accent); }
    .skills-grid, .projects-grid, .cert-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
    .skill-box, .project-card, .cert-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
    .skill-box h3 { margin: 0 0 12px; font-size: 1.05rem; color: var(--accent); }
    .tags { display: flex; flex-wrap: wrap; gap: 8px; }
    .tag { background: #1f2937; color: #e5e7eb; padding: 5px 12px; border-radius: 6px; font-size: 0.85rem; }
    .cert-card { padding: 0; overflow: hidden; }
    .img-wrap { position: relative; cursor: zoom-in; background: #000; }
    .img-wrap img { width: 100%; height: 200px; object-fit: cover; display: block; }
    .zoom-hint { position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.8); color: #fff; font-size: 0.75rem; padding: 4px 8px; border-radius: 4px; }
    .cert-info { padding: 16px; }
    .cert-info h4 { margin: 0 0 6px; font-size: 1.05rem; }
    .cert-issuer { color: var(--muted); font-size: 0.85rem; margin-bottom: 12px; display: block; }
    .verify-btn { display: inline-block; background: rgba(16, 185, 129, 0.15); color: var(--green); border: 1px solid rgba(16, 185, 129, 0.4); text-decoration: none; padding: 6px 14px; border-radius: 6px; font-size: 0.85rem; font-weight: 600; }
    .modal { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); justify-content: center; align-items: center; padding: 20px; }
    .modal img { max-width: 95%; max-height: 90vh; border-radius: 8px; border: 2px solid var(--accent); }
    .close-modal { position: absolute; top: 20px; right: 30px; color: #fff; font-size: 35px; cursor: pointer; }
    footer { text-align: center; padding: 30px 10px; color: var(--muted); font-size: 0.9rem; border-top: 1px solid var(--border); margin-top: 50px; }
  </style>
</head>
<body>
  <!-- Navigation, Hero, Skills, Labs, Certificates, and Footer Section -->
  <nav>
    <div class="logo">&lt;Priyanshu /&gt;</div>
    <div class="nav-links">
      <a href="#skills">Skills</a>
      <a href="#projects">Labs</a>
      <a href="#certificates">Certificates</a>
    </div>
  </nav>

  <div class="container">
    <section class="hero">
      <div class="status-pill">● Welcome To My Portfolio</div>
      <h1>Priyanshu Sarangi</h1>
      <p>Aspiring Ethical Hacker & Cybersecurity Enthusiast focused on Network Security, Web Application Penetration Testing, and AI-Driven Security Workflows.</p>
    </section>
  </div>

  <footer>© 2026 Priyanshu Sarangi • Hosted Securely on GitHub Pages</footer>
</body>
</html>
